<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102c49">
<title>Solicitar turno | Auto Regina</title>

<style>
:root {
  --navy:#102c49;
  --gold:#e4bd58;
  --bg:#f3f6fa;
}
* { box-sizing:border-box; }
body {
  margin:0;
  padding:18px;
  background:var(--bg);
  font:15px/1.5 system-ui,Arial;
  color:#172536;
}
.card {
  max-width:560px;
  margin:25px auto;
  background:white;
  border-radius:18px;
  padding:24px;
  box-shadow:0 8px 24px #102c4910;
}
.brand {
  color:var(--navy);
  font-weight:850;
  letter-spacing:2px;
}
h1 { color:var(--navy); }
.muted { color:#718096; }
label {
  display:block;
  font-weight:650;
  font-size:13px;
  margin:13px 0 5px;
}
input,select,textarea {
  width:100%;
  padding:12px;
  border:1px solid #d7e0e9;
  border-radius:9px;
  font:inherit;
  background:white;
}
button {
  width:100%;
  border:0;
  border-radius:9px;
  background:var(--navy);
  color:white;
  padding:14px;
  margin-top:18px;
  font:inherit;
  font-weight:700;
}
button:disabled { opacity:.6; }
#msg {
  display:none;
  padding:13px;
  margin-top:14px;
  border-radius:9px;
}
</style>
</head>

<body>
<main class="card">

<div class="brand">AUTO REGINA</div>

<h1>Solicitar un turno</h1>

<p class="muted">
Completá tus datos y enviá tu solicitud al taller.
</p>

<form id="f">

<label>Nombre y apellido</label>
<input name="name" required>

<label>Teléfono / WhatsApp</label>
<input name="phone" type="tel" required>

<label>Vehículo</label>
<input name="vehicle" placeholder="Marca y modelo" required>

<label>Servicio</label>
<select name="service" required>
<option value="">Seleccionar...</option>
<option>Mecánica general</option>
<option>Electricidad</option>
<option>Inyección electrónica</option>
<option>Revisión</option>
<option>Mantenimiento</option>
<option>Frenos</option>
<option>Embrague</option>
<option>Cambio de aceite</option>
<option>Otros</option>
</select>

<label>Fecha preferida</label>
<input name="date" type="date" id="date" required>

<label>Comentarios</label>
<textarea name="notes" rows="3"></textarea>

<button type="submit" id="send">
ENVIAR SOLICITUD
</button>

</form>

<div id="msg"></div>

</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAPKOuYBpHuqyEVNJOENPUH1113OBvykyk",
  authDomain: "autoregina.firebaseapp.com",
  databaseURL: "https://autoregina-default-rtdb.firebaseio.com",
  projectId: "autoregina",
  storageBucket: "autoregina.firebasestorage.app",
  messagingSenderId: "525939629424",
  appId: "1:525939629424:web:5da2c8ea08b2bc5659c3b5",
  measurementId: "G-GJE4HVT7KT"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

const form = document.getElementById('f');
const button = document.getElementById('send');
const msg = document.getElementById('msg');

document.getElementById('date').min =
  new Date().toISOString().slice(0,10);

function mensaje(texto, error=false) {
  msg.style.display = 'block';
  msg.style.background = error ? '#fff0f0' : '#e6f7f0';
  msg.style.color = error ? '#b42318' : '#137a57';
  msg.textContent = texto;
}

form.addEventListener('submit', async function(e) {
  e.preventDefault();

  button.disabled = true;
  button.textContent = 'ENVIANDO...';

  try {
    const user = await auth.signInAnonymously();

    const data = {
      name: form.name.value.trim(),
      phone: form.phone.value.trim(),
      vehicle: form.vehicle.value.trim(),
      service: form.service.value,
      date: form.date.value,
      notes: form.notes.value.trim(),
      status: 'pendiente',
      createdAt: firebase.database.ServerValue.TIMESTAMP
    };

    if (!data.name || !data.phone || !data.vehicle) {
      throw new Error('Completá todos los datos obligatorios.');
    }

    await db.ref('solicitudesTurno').push(data);

    mensaje(
      '¡Solicitud enviada correctamente! El taller recibió tus datos. Se comunicarán con vos para confirmar el turno.'
    );

    form.reset();

  } catch(error) {
    console.error(error);
    mensaje(
      'No se pudo enviar la solicitud: ' + error.message,
      true
    );
  } finally {
    button.disabled = false;
    button.textContent = 'ENVIAR SOLICITUD';
  }
});
</script>

</body>
</html>
