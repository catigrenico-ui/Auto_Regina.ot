
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitar turno | Auto Regina</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:20px;
  background:#eef2f7;
  font-family:Arial,sans-serif;
  color:#172b43;
}
.container{
  max-width:500px;
  margin:25px auto;
  background:white;
  padding:25px;
  border-radius:16px;
  box-shadow:0 5px 22px #00000012;
}
.header{
  text-align:center;
  margin-bottom:25px;
}
.logo{
  width:65px;
  height:65px;
  margin:auto;
  border-radius:50%;
  background:#0f2b48;
  color:#f5d76e;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  font-weight:bold;
}
h1{margin:12px 0 5px;font-size:25px}
.subtitle{color:#64748b;font-size:14px}
label{
  display:block;
  font-weight:bold;
  margin:15px 0 7px;
  font-size:14px;
}
input,select,textarea{
  width:100%;
  padding:13px;
  border:1px solid #ccd5df;
  border-radius:9px;
  font-size:15px;
  background:white;
}
textarea{min-height:90px;resize:vertical}
button{
  width:100%;
  padding:15px;
  margin-top:22px;
  border:0;
  border-radius:9px;
  background:#0f2b48;
  color:#f5d76e;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
}
button:disabled{opacity:.6;cursor:not-allowed}
.status{
  margin-top:17px;
  padding:12px;
  border-radius:8px;
  font-size:14px;
  text-align:center;
  background:#f1f5f9;
  color:#475569;
}
.success{background:#dcfce7;color:#166534}
.error{background:#fee2e2;color:#991b1b}
.note{
  margin-top:18px;
  text-align:center;
  color:#64748b;
  font-size:12px;
  line-height:1.5;
}
</style>
</head>

<body>
<div class="container">

  <div class="header">
    <div class="logo">AR</div>
    <h1>AUTO REGINA</h1>
    <div class="subtitle">Solicitud de turno · Servicio mecánico</div>
  </div>

  <form id="turnoForm">

    <label for="nombre">Nombre y apellido *</label>
    <input id="nombre" required maxlength="100"
      placeholder="Tu nombre">

    <label for="telefono">Teléfono / WhatsApp *</label>
    <input id="telefono" required maxlength="30"
      placeholder="Ej: 2984 548329">

    <label for="vehiculo">Vehículo *</label>
    <input id="vehiculo" required maxlength="120"
      placeholder="Marca, modelo y año">

    <label for="servicio">Servicio solicitado *</label>
    <select id="servicio" required>
      <option value="">Seleccionar servicio</option>
      <option>Mecánica general</option>
      <option>Electricidad</option>
      <option>Inyección electrónica</option>
      <option>Revisión</option>
      <option>Mantenimiento</option>
      <option>Cambio de aceite</option>
      <option>Frenos</option>
      <option>Embrague</option>
      <option>Otros</option>
    </select>

    <label for="fecha">Fecha preferida</label>
    <input id="fecha" type="date">

    <label for="detalles">Comentarios adicionales</label>
    <textarea id="detalles" maxlength="1000"
      placeholder="Contanos qué problema tiene el vehículo..."></textarea>

    <button type="submit" id="enviar" disabled>
      CONECTANDO CON EL TALLER...
    </button>

  </form>

  <div class="status" id="estado">
    Conectando con Auto Regina...
  </div>

  <div class="note">
    La solicitud no confirma automáticamente el turno.
    El taller se comunicará con vos para coordinarlo.
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAPKOuYBpHuqyEVNJOENPUH1113OBvykyk",
  authDomain: "autoregina.firebaseapp.com",
  databaseURL: "https://autoregina-default-rtdb.firebaseio.com",
  projectId: "autoregina",
  storageBucket: "autoregina.firebasestorage.app",
  messagingSenderId: "525939629424",
  appId: "1:525939629424:web:5da2c8ea08b2bc5659c3b5",
  measurementId: "G-GJE4HVT7KT"
};

const estado = document.getElementById("estado");
const boton = document.getElementById("enviar");
const formulario = document.getElementById("turnoForm");

let db = null;
let auth = null;
let conectado = false;

function mostrarEstado(mensaje, tipo=""){
  estado.textContent = mensaje;
  estado.className = "status " + tipo;
}

function traducirError(error){
  const codigo = error && error.code ? error.code : "";

  if(codigo.includes("permission-denied")){
    return "Firebase rechazó el permiso de escritura. Hay que revisar las reglas de la base de datos.";
  }

  if(codigo.includes("network-request-failed")){
    return "No hay conexión con Firebase. Revisá internet e intentá nuevamente.";
  }

  if(codigo.includes("operation-not-allowed")){
    return "El acceso anónimo no está habilitado en Firebase Authentication.";
  }

  if(codigo.includes("unauthorized-domain")){
    return "El dominio de GitHub Pages no está autorizado en Firebase Authentication.";
  }

  return "No se pudo conectar: " + (error.message || codigo || "Error desconocido");
}

async function iniciarFirebase(){
  try{
    if(!firebase.apps.length){
      firebase.initializeApp(firebaseConfig);
    }

    auth = firebase.auth();
    db = firebase.database();

    if(!auth.currentUser){
      await auth.signInAnonymously();
    }

    conectado = true;
    boton.disabled = false;
    boton.textContent = "SOLICITAR TURNO";

    mostrarEstado("Conectado con Auto Regina. Ya podés solicitar tu turno.");

  }catch(error){
    conectado = false;
    boton.disabled = true;
    boton.textContent = "SIN CONEXIÓN";
    mostrarEstado(traducirError(error), "error");
    console.error("Error Firebase:", error);
  }
}

formulario.addEventListener("submit", async function(e){
  e.preventDefault();

  if(!conectado || !db){
    mostrarEstado("Todavía no hay conexión con Firebase. Recargá la página.", "error");
    return;
  }

  const datos = {
    name: document.getElementById("nombre").value.trim(),
    phone: document.getElementById("telefono").value.trim(),
    vehicle: document.getElementById("vehiculo").value.trim(),
    service: document.getElementById("servicio").value,
    date: document.getElementById("fecha").value,
    details: document.getElementById("detalles").value.trim(),
    status: "Pendiente",
    createdAt: firebase.database.ServerValue.TIMESTAMP
  };

  if(!datos.name || !datos.phone || !datos.vehicle || !datos.service){
    mostrarEstado("Completá todos los campos obligatorios.", "error");
    return;
  }

  boton.disabled = true;
  boton.textContent = "ENVIANDO...";
  mostrarEstado("Guardando solicitud en Auto Regina...");

  try{
    if(!auth.currentUser){
      await auth.signInAnonymously();
    }

    const referencia = await db.ref("solicitudesTurno").push(datos);

    if(!referencia.key){
      throw new Error("Firebase no confirmó el registro.");
    }

    mostrarEstado(
      "¡Solicitud enviada correctamente! El taller se comunicará con vos para coordinar el turno.",
      "success"
    );

    formulario.reset();

  }catch(error){
    console.error("Error al guardar solicitud:", error);
    mostrarEstado(traducirError(error), "error");

  }finally{
    boton.disabled = !conectado;
    boton.textContent = conectado ? "SOLICITAR TURNO" : "SIN CONEXIÓN";
  }
});

iniciarFirebase();
</script>
</body>
</html>
