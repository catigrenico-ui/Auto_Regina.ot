
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102c49">
<title>Solicitar turno | Auto Regina</title>

<style>
:root {
  --navy:#102c49;
  --gold:#e4bd58;
  --bg:#f3f6fa;
  --line:#e4eaf1;
}
*{box-sizing:border-box}
body{
  margin:0;
  padding:18px;
  background:var(--bg);
  color:#172536;
  font:15px/1.5 system-ui,Arial,sans-serif;
}
main{max-width:560px;margin:25px auto}
.card{
  background:white;
  border:1px solid var(--line);
  border-radius:18px;
  padding:24px;
  box-shadow:0 8px 24px #102c4910;
}
.brand{
  font-weight:900;
  color:var(--navy);
  letter-spacing:2px;
  font-size:20px;
}
h1{color:var(--navy);margin:12px 0 4px}
.muted{color:#718096}
label{
  display:block;
  font-weight:650;
  font-size:13px;
  margin:14px 0 5px;
}
input,select,textarea{
  width:100%;
  padding:12px;
  border:1px solid #d7e0e9;
  border-radius:9px;
  font:inherit;
  background:white;
}
button{
  width:100%;
  border:0;
  border-radius:9px;
  background:var(--navy);
  color:white;
  font-weight:700;
  padding:14px;
  margin-top:20px;
  font:inherit;
  cursor:pointer;
}
button:disabled{opacity:.6}
#message{
  display:none;
  margin-top:15px;
  padding:13px;
  border-radius:9px;
}
.ok{display:block!important;background:#e6f7f0;color:#137a57}
.bad{display:block!important;background:#fff0f0;color:#9d3333}
</style>
</head>

<body>
<main>
<section class="card">

<div class="brand">AUTO REGINA</div>

<h1>Solicitar un turno</h1>

<p class="muted">
Completá tus datos y el taller recibirá tu solicitud.
</p>

<form id="form">

<label>Nombre y apellido</label>
<input name="name" required maxlength="100"
placeholder="Tu nombre">

<label>Teléfono / WhatsApp</label>
<input name="phone" type="tel" required maxlength="30"
placeholder="Tu teléfono">

<label>Vehículo</label>
<input name="vehicle" required maxlength="100"
placeholder="Marca, modelo y patente">

<label>Servicio solicitado</label>
<select name="service" required>
<option value="">Seleccionar...</option>
<option>Mecánica general</option>
<option>Electricidad</option>
<option>Inyección electrónica</option>
<option>Revisión</option>
<option>Mantenimiento</option>
<option>Frenos</option>
<option>Embrague</option>
<option>Cambio de aceite</option>
<option>Otros</option>
</select>

<label>Fecha preferida</label>
<input name="date" type="date" required>

<label>Comentarios (opcional)</label>
<textarea name="details" rows="3"
placeholder="Contanos qué necesita tu vehículo"></textarea>

<button id="send" type="submit">
ENVIAR SOLICITUD
</button>

<div id="message" role="status"></div>

</form>
</section>

<p class="muted" style="text-align:center;font-size:12px">
Auto Regina · Servicio mecánico
<br>
La solicitud no confirma automáticamente el turno.
</p>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAPKOuYBpHuqyEVNJOENPUH1113OBvykyk",
  authDomain: "autoregina.firebaseapp.com",
  databaseURL: "https://autoregina-default-rtdb.firebaseio.com",
  projectId: "autoregina",
  storageBucket: "autoregina.firebasestorage.app",
  messagingSenderId: "525939629424",
  appId: "1:525939629424:web:5da2c8ea08b2bc5659c3b5",
  measurementId: "G-GJE4HVT7KT"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

const form = document.getElementById('form');
const msg = document.getElementById('message');
const btn = document.getElementById('send');

form.addEventListener('submit', async e => {
  e.preventDefault();

  btn.disabled = true;
  btn.textContent = 'ENVIANDO...';

  msg.style.display = 'none';

  try {

    await auth.signInAnonymously();

    const d = Object.fromEntries(
      new FormData(form).entries()
    );

    d.status = 'Pendiente';
    d.createdAt = Date.now();

    await db.ref('solicitudesTurno').push(d);

    msg.textContent =
      '¡Solicitud enviada correctamente! Auto Regina se comunicará para confirmar tu turno.';

    msg.className = 'ok';

    form.reset();

  } catch(err) {

    console.error(err);

    msg.textContent =
      'No se pudo enviar la solicitud. Revisá la conexión o las reglas de Firebase.';

    msg.className = 'bad';

  } finally {

    btn.disabled = false;
    btn.textContent = 'ENVIAR SOLICITUD';

  }
});
</script>

</body>
</html>
