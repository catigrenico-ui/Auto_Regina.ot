<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102c49"><title>Solicitar turno | Auto Regina</title><style>:root{--n:#102c49;--g:#e4bd58;--bg:#f3f6fa;--m:#718096;--l:#e4eaf1}*{box-sizing:border-box}body{margin:0;padding:18px;background:var(--bg);font:15px/1.5 system-ui,Arial;color:#172536}.card{max-width:560px;margin:25px auto;background:#fff;border:1px solid var(--l);border-radius:18px;padding:24px;box-shadow:0 8px 24px #102c4910}.brand{font-weight:850;letter-spacing:2px;color:var(--n)}h1{color:var(--n)}.muted{color:var(--m)}label{display:block;font-weight:650;font-size:13px;margin:13px 0 5px}input,select,textarea{width:100%;padding:12px;border:1px solid #d7e0e9;border-radius:9px;font:inherit}button{width:100%;border:0;border-radius:9px;background:var(--n);color:white;padding:13px;margin-top:18px;font:inherit;font-weight:700}.demo{padding:12px;background:#fff7df;color:#725a1b;border-radius:10px;margin:16px 0}#msg{display:none;padding:12px;margin-top:14px;border-radius:9px;background:#e6f7f0;color:#137a57}</style></head><body><main class="card"><div class="brand">AUTO REGINA</div><h1>Solicitar un turno</h1><p class="muted">Completá tus datos para simular una solicitud.</p><div class="demo"><b>Modo demostración:</b> el formulario valida los datos en este dispositivo, pero no envía ni reserva un turno real porque todavía no está conectado a Firebase.</div><form id="f"><label>Nombre y apellido</label><input name="name" required><label>Teléfono / WhatsApp</label><input name="phone" type="tel" required><label>Vehículo</label><input name="vehicle" placeholder="Marca y modelo" required><label>Servicio</label><select name="service" required><option value="">Seleccionar...</option><option>Mecánica general</option><option>Electricidad</option><option>Inyección electrónica</option><option>Revisión</option><option>Mantenimiento</option><option>Frenos</option><option>Embrague</option><option>Cambio de aceite</option><option>Otros</option></select><label>Fecha preferida</label><input name="date" type="date" required><label>Comentarios</label><textarea name="notes" rows="3"></textarea><button>Probar solicitud</button></form><div id="msg"></div></main><script>document.getElementById('f').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const m=document.getElementById('msg');m.style.display='block';m.innerHTML='<b>Solicitud de demostración recibida en esta pantalla.</b><br>'+d.name+' · '+d.vehicle+' · '+d.service+' · '+d.date+'<br><small>No se envió al taller ni se guardó en un servidor.</small>';};</script></body></html>
