<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102c49">
<title>Seguimiento | Auto Regina</title>
<style>
:root{--navy:#102c49;--gold:#e4bd58;--bg:#f3f6fa;--line:#e4eaf1;--muted:#718096}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172536;font:15px/1.5 system-ui,Arial,sans-serif;padding:20px}
main{max-width:560px;margin:25px auto}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 24px #102c4910}
.brand{color:var(--navy);font-weight:800;letter-spacing:1.5px}h1{color:var(--navy);font-size:25px;margin:8px 0}.muted{color:var(--muted)}.status{display:inline-block;border-radius:30px;padding:7px 12px;background:#fff4d6;color:#795b10;font-weight:700}
.item{padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.label{font-size:12px;color:var(--muted)}.value{font-weight:650;overflow-wrap:anywhere}
.notice{padding:13px;border-radius:10px;background:#fff8e7;color:#725a1b;margin-top:14px}.error{background:#fff0f0;color:#9d3333}.loading{text-align:center;padding:30px;color:var(--muted)}
</style>
</head>
<body><main><section class="card">
<div class="brand">AUTO REGINA</div><h1>Seguimiento de tu vehículo</h1>
<p class="muted">Consultá el estado de tu orden de trabajo.</p>
<div id="content" class="loading">Consultando orden...</div>
</section><p class="muted" style="text-align:center;font-size:12px">Auto Regina · Servicio mecánico</p></main>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  "apiKey": "AIzaSyAPKOuYBpHuqyEVNJOENPUH1113OBvykyk",
  "authDomain": "autoregina.firebaseapp.com",
  "databaseURL": "https://autoregina-default-rtdb.firebaseio.com",
  "projectId": "autoregina",
  "storageBucket": "autoregina.firebasestorage.app",
  "messagingSenderId": "525939629424",
  "appId": "1:525939629424:web:5da2c8ea08b2bc5659c3b5",
  "measurementId": "G-GJE4HVT7KT"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const token = new URLSearchParams(location.search).get('token');
const content = document.getElementById('content');
const safe = v => String(v ?? 'No informado').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function show(o) {
  const status = o.status || 'Pendiente';
  content.className = '';
  content.innerHTML = `
    <div class="item"><div class="label">Número de orden</div><div class="value">${safe(o.number)}</div></div>
    <div class="item"><div class="label">Cliente</div><div class="value">${safe(o.clientLabel)}</div></div>
    <div class="item"><div class="label">Vehículo</div><div class="value">${safe(o.vehicleLabel)}</div></div>
    <div class="item"><div class="label">Fecha de ingreso</div><div class="value">${safe(o.date)}</div></div>
    <div class="item"><div class="label">Servicio</div><div class="value">${safe(o.service)}</div></div>
    <div class="item"><div class="label">Estado actual</div><div class="status">${safe(status)}</div></div>
    <div class="item"><div class="label">Trabajo / diagnóstico</div><div class="value">${safe(o.description)}</div></div>
    <p class="muted" style="font-size:12px">La información se actualiza cuando Auto Regina modifica la orden.</p>`;
}
if (!token) {
  content.className='notice error'; content.textContent='El enlace no contiene un código de seguimiento válido.';
} else {
  db.ref('ordenes/' + token).on('value', snap => {
    if (!snap.exists()) {
      content.className='notice'; content.textContent='Todavía no encontramos esta orden. Si acabás de recibir el QR, consultá con Auto Regina.';
    } else show(snap.val());
  }, err => {
    content.className='notice error'; content.textContent='No se pudo consultar el seguimiento. Verificá la conexión o contactá al taller.';
  });
}
</script></body></html>
