<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102c49"><title>Seguimiento | Auto Regina</title>
<style>
:root{--navy:#102c49;--gold:#e4bd58;--bg:#f2f5f9;--muted:#718096;--line:#e4eaf1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172536;font:15px/1.5 system-ui,Arial,sans-serif;padding:20px}.wrap{max-width:650px;margin:40px auto}.card{background:white;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 12px 35px #102c4910}.brand{font-weight:850;letter-spacing:2px;color:var(--navy)}h1{font-size:30px;line-height:1.2;color:var(--navy);margin:12px 0}.muted{color:var(--muted)}.demo{background:#fff7df;border:1px solid #f0dfad;color:#725a1b;border-radius:12px;padding:12px 14px;margin:18px 0}.error{background:#fff0f0;color:#963d3d;border-radius:12px;padding:16px;margin-top:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.pill{background:#eaf1f8;color:var(--navy);padding:7px 12px;border-radius:30px;font-weight:750;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}.item{background:#f7f9fc;border:1px solid var(--line);border-radius:12px;padding:13px}.item small{display:block;color:var(--muted);margin-bottom:4px}.item strong{color:var(--navy);overflow-wrap:anywhere}.section{border-top:1px solid var(--line);padding-top:18px;margin-top:18px}.status{display:inline-block;background:#fff2d3;color:#886516;border-radius:30px;padding:8px 13px;font-weight:750}.footer{text-align:center;color:var(--muted);margin:18px}
@media(max-width:480px){body{padding:12px}.wrap{margin:22px auto}.card{padding:21px}.grid{grid-template-columns:1fr 1fr}h1{font-size:26px}}
</style></head><body><main class="wrap"><section class="card"><div class="brand">AUTO REGINA</div><h1>Seguimiento de tu vehículo</h1><p class="muted">Consultá el estado de tu orden de trabajo.</p><div id="content"><p class="muted">Cargando orden...</p></div></section><div class="footer">Auto Regina · Servicio mecánico</div></main>
<script>
const box=document.getElementById('content');
function esc(v){return String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
try{const raw=new URLSearchParams(location.search).get('demo');if(!raw)throw new Error('Falta el código de demostración. Abrí el QR generado desde una orden de trabajo.');const data=JSON.parse(decodeURIComponent(escape(atob(raw))));const status=data.status||'Pendiente';box.innerHTML=`<div class="demo"><strong>Modo demostración</strong><br>Estos son datos ficticios incluidos en el QR. No se consultó Firebase.</div><div class="top"><h2 style="margin:0;color:#102c49">${esc(data.number)}</h2><span class="pill">Orden de trabajo</span></div><div class="grid"><div class="item"><small>Cliente</small><strong>${esc(data.client)}</strong></div><div class="item"><small>Vehículo</small><strong>${esc(data.vehicle)}</strong></div><div class="item"><small>Fecha de ingreso</small><strong>${esc(data.date)}</strong></div><div class="item"><small>Servicio</small><strong>${esc(data.service)}</strong></div><div class="item"><small>Kilometraje</small><strong>${esc(data.km)} km</strong></div><div class="item"><small>Total estimado</small><strong>${data.total?new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Number(data.total)): 'A confirmar'}</strong></div></div><div class="section"><small class="muted">Estado actual</small><p><span class="status">${esc(status)}</span></p></div><div class="section"><strong style="color:#102c49">Diagnóstico / trabajo</strong><p>${esc(data.description||'Sin detalle cargado.')}</p></div><div class="section"><strong style="color:#102c49">Observaciones</strong><p>${esc(data.notes||'Sin observaciones.')}</p></div>`;
}catch(e){box.innerHTML=`<div class="error">${esc(e.message||'No se pudo leer el enlace de seguimiento.')}</div>`;}
</script></body></html>
